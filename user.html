<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف مستخدم · ARAB code</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">ARAB code</a>
            <div class="nav-actions">
                <button class="search-btn" title="بحث">🔍</button>
                <a href="/submit" class="add-btn">+ كود</a>
                <a href="/admin" class="admin-link">الإدارة</a>
                <div id="user-nav"></div>
            </div>
        </div>
    </header>

    <main>
        <div id="profile-header"></div>
        <div class="container">
            <h3>الأكواد المنشورة</h3>
            <div id="user-codes" class="codes-grid"></div>
            <div id="pagination-container" class="pagination"></div>
        </div>
    </main>

    <script src="/app.js"></script>
    <script>
        (async () => {
            const url = new URL(window.location.href);
            const pathParts = url.pathname.split('/');
            const username = pathParts[pathParts.length - 1];
            if (!username) return;

            let allCodes = [];
            let currentPage = 1;
            const codesPerPage = 15;

            async function loadProfile() {
                try {
                    const res = await fetch(`/api/user?username=${username}`);
                    const data = await res.json();
                    if (data.error) {
                        document.querySelector('main').innerHTML = `<div class="container"><p>${data.error}</p></div>`;
                        return;
                    }

                    const u = data.user;
                    document.getElementById('profile-header').innerHTML = `
                        <div class="profile-banner" style="background-image: url('${u.banner_url || 'https://via.placeholder.com/1200x300'}')">
                            <div class="profile-info">
                                <img src="${u.avatar_url || 'https://nezukouploads.servegame.net/file/qwjuA.jpg'}" class="profile-avatar">
                                <h2>${u.display_name} ${u.is_verified_badge ? '✔️' : ''}</h2>
                                <p>@${u.username}</p>
                                <p class="bio">${u.bio}</p>
                            </div>
                        </div>
                    `;

                    allCodes = data.codes || [];
                    renderPage(1);

                    const userNav = document.getElementById('user-nav');
                    const meRes = await fetch('/api/me');
                    const meData = await meRes.json();
                    if (meData.user) {
                        userNav.innerHTML = `
                            <a href="/u/${meData.user.username}" class="user-link">
                                <img src="${meData.user.avatar_url || 'https://nezukouploads.servegame.net/file/qwjuA.jpg'}" class="nav-avatar">
                                ${meData.user.username}
                            </a>
                            <button onclick="logout()" class="logout-btn" title="خروج">🚪</button>
                        `;
                    } else {
                        userNav.innerHTML = `<a href="/login" class="login-btn">دخول</a>`;
                    }
                } catch (e) {
                    console.error("PROFILE_LOAD_ERROR:", e);
                }
            }

            function renderPage(page) {
                currentPage = page;
                const container = document.getElementById('user-codes');
                
                const start = (page - 1) * codesPerPage;
                const end = start + codesPerPage;
                const pageCodes = allCodes.slice(start, end);

                if (pageCodes.length === 0) {
                    container.innerHTML = '<p>لا توجد أكواد منشورة بعد.</p>';
                } else {
                    container.innerHTML = pageCodes.map(c => window.codeCard(c)).join('');
                }

                renderPagination();
                window.scrollTo(0, 0);
            }

            function renderPagination() {
                const container = document.getElementById('pagination-container');
                container.innerHTML = '';
                const totalPages = Math.ceil(allCodes.length / codesPerPage);
                if (totalPages <= 1) return;

                const prevBtn = document.createElement('button');
                prevBtn.innerText = 'السابق';
                prevBtn.disabled = currentPage === 1;
                prevBtn.onclick = () => renderPage(currentPage - 1);
                container.appendChild(prevBtn);

                const info = document.createElement('span');
                info.innerText = ` صفحة ${currentPage} من ${totalPages} `;
                container.appendChild(info);

                const nextBtn = document.createElement('button');
                nextBtn.innerText = 'التالي';
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.onclick = () => renderPage(currentPage + 1);
                container.appendChild(nextBtn);
            }

            window.logout = async () => {
                await fetch('/api/logout', { method: 'POST' });
                location.reload();
            };

            loadProfile();
        })();
    </script>
</body>
</html>
