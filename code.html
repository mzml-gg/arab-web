<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كود · ARAB code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><span class="dot"></span> ARAB code</a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>
<main class="container">
  <div id="header"></div>
  <div class="code-actions" id="actions"></div>
  <div class="code-view"><pre><code id="code" class="hljs">تحميل...</code></pre></div>
</main>
<script src="/app.js"></script>
<script>
(async () => {
  await renderNav();
  const parts = location.pathname.split('/').filter(Boolean);
  const filename = decodeURIComponent(parts[0] === 'c' ? (parts[1] || '') : (new URLSearchParams(location.search).get('file') || new URLSearchParams(location.search).get('c') || new URLSearchParams(location.search).get('x') || ''));
  if (!filename) { location.href='/'; return; }
  const rawUrl = `/api/raw?file=${encodeURIComponent(filename)}`;
  const ghRaw = `https://raw.githubusercontent.com/mzml-gg/arab-web/main/codes/${encodeURIComponent(filename)}`;

  let meta = { title: filename, author: 'unknown', language: (filename.split('.').pop()||'txt') };
  try {
    const { codes } = await api('/api/list');
    meta = codes.find(c => c.filename === filename) || meta;
  } catch {}
  const me = await loadMe();
  const isOwner = me && me.username.toLowerCase() === (meta.author||'').toLowerCase();

  const badge = meta.admin_added ? verifiedBadge() : '';
  document.getElementById('header').innerHTML = `
    <div class="code-header">
      <div>
        <h2>${esc(meta.title)} ${badge}</h2>
        <div class="meta-row">
          ${authorLink(meta)}
          <span>·</span>
          <span class="lang-tag">${esc(meta.language||'txt')}</span>
          <span>·</span>
          <span>${esc(filename)}</span>
        </div>
      </div>
    </div>`;

  const actions = document.getElementById('actions');
  actions.innerHTML = `
    <button class="btn primary" onclick="copyCode()">📋 نسخ</button>
    <a class="btn" href="${ghRaw}" target="_blank">Raw</a>
    <a class="btn" href="/submit?fork=${encodeURIComponent(filename)}">🍴 Fork</a>
    ${isOwner ? `<button class="btn danger" onclick="requestDelete()">طلب حذف</button>` : ''}
  `;

  try {
    const r = await fetch(rawUrl);
    const t = await r.text();
    window.__codeText = t;
    const codeEl = document.getElementById('code');
    codeEl.textContent = t;
    codeEl.className = 'hljs language-' + (meta.language || 'plaintext');
    if (window.hljs) hljs.highlightElement(codeEl);
  } catch (e) {
    document.getElementById('code').textContent = 'تعذّر تحميل الكود';
  }
})();

async function copyCode() {
  try { await navigator.clipboard.writeText(window.__codeText || ''); alert('تم النسخ ✓'); }
  catch { alert('تعذر النسخ'); }
}

async function requestDelete() {
  const reason = prompt('سبب طلب الحذف (اختياري):') || '';
  if (reason === null) return;
  const parts = location.pathname.split('/').filter(Boolean);
  const filename = decodeURIComponent(parts[0] === 'c' ? (parts[1] || '') : (new URLSearchParams(location.search).get('file') || new URLSearchParams(location.search).get('c') || new URLSearchParams(location.search).get('x') || ''));
  try {
    await api('/api/delete-request', { method:'POST', body: JSON.stringify({ filename, reason }) });
    alert('تم إرسال طلب الحذف للإدارة ✓');
  } catch (e) { alert(e.message); }
}
</script>
</body>
</html>
