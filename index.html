<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAB code · منصة نشر الأكواد العربية</title>
<meta name="description" content="منصة ARAB code لنشر ومشاركة الأكواد العربية المفتوحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="https://nezukouploads.servegame.net/file/cXNtl.jpg">
<style>
  .brand .dot{background:url('https://nezukouploads.servegame.net/file/cXNtl.jpg') center/cover no-repeat !important;box-shadow:0 0 14px rgba(240,180,0,.35)}
  .hero .sphere{width:120px;height:120px;background:url('https://nezukouploads.servegame.net/file/cXNtl.jpg') center/cover no-repeat;box-shadow:0 12px 34px rgba(0,0,0,.15);animation:none}
  .stats-bar{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
  .stats-bar b{color:var(--gold-2);font-size:17px;display:block}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><span class="dot"></span> ARAB code</a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<header class="hero">
  <div class="sphere"></div>
  <h1>ARAB code</h1>
  <p class="tag">منصة نشر الأكواد ARAB CODE</p>
  <div class="stats-bar" id="stats"></div>
</header>

<main class="container">
  <div id="codes" class="grid"></div>
  <div id="pagination" class="pagination"></div>
  <p id="empty" style="text-align:center;color:var(--muted);display:none;margin-top:40px">لا توجد أكواد منشورة بعد.</p>
</main>

<script src="/app.js"></script>
<script>
let allCodes = [];
let currentPage = 1;
const perPage = 15;

async function renderCurrentPage() {
  const box = document.getElementById('codes');
  const pagBox = document.getElementById('pagination');
  if (!box || !pagBox) return;
  const start = (currentPage - 1) * perPage;
  const end = start + perPage;
  const codes = allCodes.slice(start, end);
  
  if (!codes.length) {
    box.innerHTML = '';
    pagBox.innerHTML = '';
    return;
  }

  // Fetch like totals only for visible codes to improve performance
  const totals = {};
  await Promise.all(codes.map(async (c) => {
    try { totals[c.filename] = (await api('/api/likes?code=' + encodeURIComponent(c.filename))).total || 0; }
    catch { totals[c.filename] = 0; }
  }));
  
  box.innerHTML = codes.map((c) => codeCard(c, { likes: totals[c.filename] || 0 })).join('');
  
  // Render Pagination UI
  const totalPages = Math.ceil(allCodes.length / perPage);
  if (totalPages <= 1) {
    pagBox.innerHTML = '';
    return;
  }

  pagBox.innerHTML = `
    <button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>السابق</button>
    <span class="pagination-info">صفحة ${currentPage} من ${totalPages}</span>
    <button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>التالي</button>
  `;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function changePage(p) {
  currentPage = p;
  renderCurrentPage();
}

async function fetchAndRenderCodes() {
  try {
    const { codes } = await api(`/api/list?_t=${Date.now()}`);
    if (!codes || !codes.length) {
      document.getElementById('empty').style.display = 'block';
      document.getElementById('codes').innerHTML = '';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('empty').style.display = 'none';
    allCodes = codes;
    
    const devs = new Set(codes.map(c => (c.author || '').toLowerCase()).filter(Boolean));
    document.getElementById('stats').innerHTML =
      `<div><b>${codes.length}</b> كود منشور</div><div><b>${devs.size}</b> مطوّر</div>`;
      
    await renderCurrentPage();
  } catch (e) {
    console.error('Error fetching codes:', e);
  }
}

(async () => {
  await renderNav();
  await fetchAndRenderCodes();
  const me = await loadMe();
  await renderBanOverlay(me);
  setInterval(fetchAndRenderCodes, 60000);
})();
</script>
</body>
</html>
