<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAB code</title>
<meta name="description" content="منصة ARAB code لنشر الأكواد">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<!-- أيقونة الموقع الجديدة -->
<link rel="icon" href="https://nezukouploads.servegame.net/file/cXNtl.jpg">

<style>
  /* تعديل شعار الهيرو واستبدال الكرة الصفراء بالصورة الجديدة */
  .hero .sphere {
    width: 120px;
    height: 120px;
    background: url('https://nezukouploads.servegame.net/file/cXNtl.jpg') center/cover no-repeat;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    box-shadow: 0 8px 25px rgba(255, 193, 7, 0.3);
  }

  /* تصميم شبكة البطاقات */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 25px;
  }

  /* تنسيق بطاقة الكود الموحدة والأنيقة */
  .code-card {
    background: #ffffff;
    border: 1px solid #f0e6d2;
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
  }

  .code-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  .card-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #2b2b2b;
    margin: 0 0 8px 0;
  }

  .card-desc {
    font-size: 0.88rem;
    color: #666;
    margin: 0 0 15px 0;
    line-height: 1.4;
  }

  /* قسم المعلومات والمؤلف داخل البطاقة */
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid #f5f0e6;
    margin-top: auto;
  }

  .author-info {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #333;
    font-weight: 600;
    font-size: 0.85rem;
  }

  .author-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #e5e7eb;
  }

  .lang-badge {
    background: #fdf6e2;
    color: #d97706;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><span class="dot"></span> ARAB code</a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<header class="hero">
  <div class="sphere"></div>
  <h1>ARAB code</h1>
  <p class="tag">منصة نشر الأكواد ARAB CODE</p>
</header>

<main class="container">
  <div id="codes" class="grid"></div>
  <p id="empty" style="text-align:center;color:var(--muted);display:none;margin-top:40px">لا توجد أكواد منشورة بعد.</p>
</main>

<script src="/app.js"></script>
<script>
// جلب صورة البروفايل الحقيقية أو عمل افتراضية من أول حرفين
function getAvatarUrl(code) {
  if (code.avatar) return code.avatar;
  if (code.avatar_url) return code.avatar_url;
  if (code.author_avatar) return code.author_avatar;
  if (code.photoURL) return code.photoURL;
  
  const name = code.author || 'User';
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&length=2&background=random&color=fff&rounded=true`;
}

function renderCustomCard(code) {
  const authorName = code.author || 'مجهول';
  const avatarUrl = getAvatarUrl(code);
  
  // شارة التوثيق الأصليّة
  const isVerified = code.admin_added || code.is_admin || code.verified || authorName.toLowerCase() === 'ziad';
  const badgeHtml = isVerified 
    ? (typeof verifiedBadge === 'function' ? verifiedBadge() : (typeof verifiedIcon === 'function' ? verifiedIcon() : '✓')) 
    : '';

  const fileUrl = `/c/${encodeURIComponent(code.filename || code.title)}`;

  return `
    <div class="code-card" onclick="location.href='${fileUrl}'" style="cursor:pointer;">
      <div>
        <h3 class="card-title">${esc(code.title || code.filename)}</h3>
        <p class="card-desc">${esc(code.description || 'لا يوجد وصف لهذا الكود')}</p>
      </div>
      <div class="card-footer">
        <a href="/u/${encodeURIComponent(authorName)}" class="author-info" onclick="event.stopPropagation();">
          <img src="${avatarUrl}" alt="${esc(authorName)}" class="author-avatar" onError="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&length=2'">
          <span>${esc(authorName)}</span>
          ${badgeHtml}
        </a>
        <span class="lang-badge">${esc(code.language || 'txt')}</span>
      </div>
    </div>
  `;
}

(async () => {
  await renderNav();
  try {
    const { codes } = await api('/api/list');
    const box = document.getElementById('codes');
    if (!codes || !codes.length) { 
      document.getElementById('empty').style.display = 'block'; 
      return; 
    }
    
    // إجبار الصفحة على استخدام دالة البناء الجديدة الخاصة بنا لتجاوز دالة codeCard القديمة
    box.innerHTML = codes.map(renderCustomCard).join('');
  } catch (e) { 
    console.error(e); 
  }
})();
</script>
</body>
</html>
