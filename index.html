<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAB code · منصة نشر الأكواد العربية</title>
<meta name="description" content="منصة ARAB code لنشر ومشاركة الأكواد العربية المفتوحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="https://nezukouploads.servegame.net/file/cXNtl.jpg">
<style>
  .brand .dot{background:url('https://nezukouploads.servegame.net/file/cXNtl.jpg') center/cover no-repeat !important;box-shadow:0 0 14px rgba(240,180,0,.35)}
  .hero .sphere{width:120px;height:120px;background:url('https://nezukouploads.servegame.net/file/cXNtl.jpg') center/cover no-repeat;box-shadow:0 12px 34px rgba(0,0,0,.15);animation:none}
  .stats-bar{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
  .stats-bar b{color:var(--gold-2);font-size:17px;display:block}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand"><span class="dot"></span> ARAB code</a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<header class="hero">
  <div class="sphere"></div>
  <h1>ARAB code</h1>
  <p class="tag">منصة نشر الأكواد ARAB CODE</p>
  <div class="stats-bar" id="stats"></div>
</header>

<main class="container">
  <div id="codes" class="grid"></div>
  <div id="pagination" class="pagination"></div>
  <p id="empty" style="text-align:center;color:var(--muted);display:none;margin-top:40px">لا توجد أكواد منشورة بعد.</p>
</main>

<footer class="footer">
  <div class="footer-decoration"></div>
  <div class="footer-content">
    <div class="footer-rights">
      <span>© 2026 Code ARAB</span>
      <span class="bmg">— BMG</span>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
let allCodes = [];

function showCodeSkeleton(container, count = 6) {
  if (!container) return;
  container.className = 'skeleton-grid';
  container.innerHTML = Array.from({ length: count }, () => `
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-text"></div>
      <div class="skeleton-line skeleton-text" style="width:70%"></div>
      <div class="skeleton-footer">
        <div class="skeleton-line skeleton-badge"></div>
        <div style="display:flex;gap:6px;align-items:center">
          <div class="skeleton-line skeleton-badge" style="width:60px"></div>
          <div class="skeleton-line skeleton-avatar-sm"></div>
        </div>
      </div>
    </div>`).join('');
}

function revealCards(container) {
  if (!container) return;
  container.className = 'grid';
  [...container.children].forEach((card, index) => {
    card.classList.add('reveal-item');
    card.style.setProperty('--i', index);
  });
}

async function fetchAndRenderCodes() {
  const box = document.getElementById('codes');
  const pagBox = document.getElementById('pagination');
  if (!box) return;
  
  try {
    const { codes } = await api(`/api/list?_t=${Date.now()}`);
    if (!codes || !codes.length) {
      document.getElementById('empty').style.display = 'block';
      box.innerHTML = '';
      if (pagBox) pagBox.innerHTML = '';
      return;
    }
    document.getElementById('empty').style.display = 'none';
    allCodes = codes;
    
    const devs = new Set(codes.map(c => (c.author || '').toLowerCase()).filter(Boolean));
    document.getElementById('stats').innerHTML =
      `<div><b>${codes.length}</b> كود منشور</div><div><b>${devs.size}</b> مطوّر</div>`;
      
    box.innerHTML = codes.map((c) => codeCard(c)).join('');
    revealCards(box);
    if (pagBox) pagBox.innerHTML = '';
  } catch (e) {
    console.error('Error fetching codes:', e);
  }
}

(async () => {
  showCodeSkeleton(document.getElementById('codes'));
  await Promise.all([renderNav(), fetchAndRenderCodes()]);
  const me = await loadMe();
  await renderBanOverlay(me);
  setInterval(fetchAndRenderCodes, 60000);
})();
</script>
</body>
</html>
