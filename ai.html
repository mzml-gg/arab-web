<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BMG AI — ARAB CODE</title>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap');

    :root {
      --brand-blue: #ffd700;
      --brand-blue-light: #fff;
      --brand-glow: rgba(255, 215, 0, 0.3);
      --sidebar-bg: #0f0f11;
      --card-bg: #141416;
      --card-border: rgba(255, 255, 255, 0.08);
      --user-msg-bg: #1e293b;
      --ai-msg-bg: transparent; 
      --hover-bg: #1f1f23;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .msg-bubble, textarea, input {
      user-select: text;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #0a0a0a !important;
    }

    body {
      font-family: 'Alexandria', sans-serif;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.2;
    }

    header {
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: #0d0d0e;
      z-index: 10;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: var(--hover-bg);
      border-color: rgba(255,255,255,0.18);
    }

    .kimi-pill-group {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 4px 10px;
      gap: 6px;
    }

    .kimi-pill-action-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      color: #e4e4e7;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .kimi-pill-action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .kimi-chat-bubble-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: #e4e4e7;
    }

    .badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd700;
      animation: beaconGlow 1.8s infinite ease-in-out;
    }

    @keyframes beaconGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.8); transform: scale(0.95); }
      70% { box-shadow: 0 0 0 8px rgba(255, 215, 0, 0); transform: scale(1.1); }
      100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); transform: scale(0.95); }
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 2;
      scroll-behavior: smooth;
    }

    .welcome-container {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .avatar-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
    }

    .brand-avatar {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
      z-index: 2;
      box-shadow: 0 10px 30px rgba(184,134,11,0.5);
      animation: kimiFloating 3s ease-in-out infinite;
    }

    @keyframes kimiFloating {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.02) rotate(2deg); }
    }

    .avatar-eye {
      width: 5px;
      height: 14px;
      background: #000;
      border-radius: 2px;
      margin: 0 2px;
      animation: eyeBlinkAction 3.5s infinite;
    }

    @keyframes eyeBlinkAction {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.05); }
    }

    .welcome-text {
      font-size: 18px;
      color: #ffd700;
      font-weight: 700;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-start;
      direction: rtl;
    }

    .msg-row.ai {
      justify-content: flex-start;
      direction: ltr;
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
      direction: rtl;
      min-width: 0;
      flex: 1;
    }

    .user .msg-content-wrapper {
      align-items: flex-start;
      max-width: 85%;
      flex: none;
    }

    .ai .msg-content-wrapper {
      align-items: flex-start;
      width: 100%;
      max-width: 100%; 
    }

    .msg-bubble {
      line-height: 1.7;
      font-size: 15px;
      word-break: break-word;
    }

    .user .msg-bubble {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 18px;
      border-top-right-radius: 4px;
    }

    .ai .msg-bubble {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f3f4f6;
      padding: 16px 20px;
      border-radius: 22px;
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    .msg-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      font-size: 14px;
    }

    .msg-bubble th, .msg-bubble td {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: right;
    }

    .msg-bubble th {
      background: rgba(184,134,11,0.2);
      color: #ffd700;
    }

    .code-block-wrapper {
      margin: 14px 0;
      border-radius: 10px;
      overflow: hidden; 
      border: 1px solid var(--card-border);
      background: #050505;
      direction: ltr;
    }

    .code-header {
      background: #1c1c1f;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #a1a1aa;
    }

    .copy-code-btn {
      background: #2a2a2e;
      border: none;
      color: #e4e4e7;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: #0d0d0e;
      z-index: 100;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .input-box {
      background: #1a1a1d;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none !important;
      outline: none !important;
      color: #ffffff;
      font-size: 15px;
      padding: 8px;
      resize: none;
      height: 40px;
      font-family: inherit;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffd700 !important;
      color: #000 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
    }

    .thinking-dots { display: flex; gap: 4px; align-items: center; color: #ffd700; font-weight: 600; }
    .thinking-dots span { width: 4px; height: 4px; background: #ffd700; border-radius: 50%; animation: thinkPulse 1s infinite alternate; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinkPulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
  </style>
</head>

<body>
  <canvas id="particles-canvas"></canvas>

  <header>
    <div class="icon-btn" onclick="location.href='/'"><i class="fa-solid fa-arrow-right"></i></div>
    
    <div class="badge">
      <div class="badge-dot"></div>
      <span>BMG AI — ARAB CODE</span>
    </div>

    <div class="kimi-pill-group">
      <div class="kimi-pill-action-btn" onclick="location.reload()" title="محادثة جديدة">
        <i class="fa-solid fa-rotate-right"></i>
      </div>
    </div>
  </header>

  <main id="chatArea">
    <div class="welcome-container" id="welcome">
      <div class="brand-avatar">
        <div class="avatar-eye"></div>
        <div class="avatar-eye"></div>
      </div>
      <div class="welcome-text">أهلاً بك في BMG AI! كيف يمكنني مساعدتك اليوم؟</div>
    </div>
  </main>

  <footer>
    <div class="input-box">
      <textarea id="userInput" placeholder="اسأل BMG AI..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
    <div id="ai-limit-wrap" style="text-align:center; margin-top:10px;"></div>
  </footer>

  <script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    let aiMsgCount = parseInt(localStorage.getItem('bmg_ai_count') || '0');
    let aiSessionId = localStorage.getItem('bmg_ai_session') || Math.random().toString(36).substring(7);
    const GUEST_LIMIT = 5;
    const CHAT_LIMIT = 20;

    function autoResize(el) {
      el.style.height = '40px';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    async function send() {
      const text = userInput.value.trim();
      if (!text) return;

      const me = window.__ME || null;
      if (!me && aiMsgCount >= GUEST_LIMIT) {
        document.getElementById('ai-limit-wrap').innerHTML = `
          <div style="color:#f87171; font-size:13px; background:rgba(239,68,68,0.1); padding:10px; border-radius:12px; border:1px solid rgba(239,68,68,0.2);">
            لقد استنفدت الرسائل المجانية. يرجى <a href="/auth" style="color:#ffd700; text-decoration:underline;">تسجيل الدخول</a> للمتابعة.
          </div>`;
        return;
      }

      if (aiMsgCount >= CHAT_LIMIT) {
        document.getElementById('ai-limit-wrap').innerHTML = `
          <div style="color:#f87171; font-size:13px; background:rgba(239,68,68,0.1); padding:10px; border-radius:12px; border:1px solid rgba(239,68,68,0.2);">
            لقد امتلأت الرسائل. <button onclick="location.reload()" style="background:none; border:none; color:#ffd700; text-decoration:underline; cursor:pointer;">ابدأ محادثة جديدة</button>
          </div>`;
        return;
      }

      document.getElementById('welcome').style.display = 'none';
      addBubble('user', text);
      userInput.value = '';
      autoResize(userInput);

      const loader = addLoader();
      
      try {
        const res = await fetch(`/api/ai?prompt=${encodeURIComponent(text)}&session_id=${aiSessionId}&model=BMG-1.7`);
        let data = await res.text();
        
        try {
          const parsed = JSON.parse(data);
          if (parsed.reply) data = parsed.reply;
        } catch(e) {}

        removeEl(loader);
        addBubble('ai', data);
        
        aiMsgCount++;
        localStorage.setItem('bmg_ai_count', aiMsgCount);
      } catch (e) {
        removeEl(loader);
        addBubble('ai', "عذراً، واجهت مشكلة في الاتصال بخادم BMG AI.");
      }
    }

    function addBubble(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;
      
      if (role === 'user') {
        row.innerHTML = `<div class="msg-content-wrapper"><div class="msg-bubble">${text}</div></div>`;
      } else {
        row.innerHTML = `
          <div class="msg-content-wrapper">
            <div class="msg-bubble">${formatResponse(text)}</div>
          </div>`;
      }
      
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function formatResponse(text) {
      text = text.replace(/^success":true,"model_used":".*?","reply":/, '');
      text = text.replace(/\|(.+)\|/g, (match) => {
        const cells = match.split('|').filter(c => c.trim() !== '');
        if (cells.length === 0) return match;
        return `<table><tr>${cells.map(c => `<td>${c.trim()}</td>`).join('')}</tr></table>`;
      });
      text = text.replace(/<\/table><table>/g, '');
      text = text.replace(/```([\s\S]*?)```/g, '<div class="code-block-wrapper"><div class="code-header"><span>code</span></div><pre><code>$1</code></pre></div>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function addLoader() {
      const id = 'loader-' + Date.now();
      const row = document.createElement('div');
      row.id = id;
      row.className = 'msg-row ai';
      row.innerHTML = `
        <div class="msg-content-wrapper">
          <div class="msg-bubble">
            <div class="thinking-dots"><span></span><span></span><span></span> جاري التفكير...</div>
          </div>
        </div>`;
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
      return id;
    }

    function removeEl(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
